<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>座位信息 - 中国电信云生态大会</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: url('seat-map.jpg') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px 40px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        .title-block {
            text-align: center;
            color: #fff;
            margin-bottom: 36px;
        }
        .title-block h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        .card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }

        .seat-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 32px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .seat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .seat-number {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .seat-company {
            margin-top: 14px;
            font-size: 13px;
            opacity: 0.85;
            word-break: break-all;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .actions button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .actions .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
        }
        .actions .btn-primary:active { transform: scale(0.98); }
        .actions .btn-secondary {
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .actions .btn-secondary:hover {
            background: #667eea;
            color: #fff;
        }

        /* Step indicator */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }
        .step-dot.active {
            background: #667eea;
            width: 24px;
            border-radius: 4px;
        }

        /* Seat Map Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
        }
        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { color: #333; }
        .modal-close {
            width: 30px; height: 30px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .modal-body { padding: 18px; }
        .modal-body img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Title -->
    <div class="title-block">
        <h1>中国电信云生态大会<br>智能云应用论坛</h1>
    </div>

    <!-- Card -->
    <div class="card">
        <div class="step-indicator">
            <div class="step-dot"></div>
            <div class="step-dot active"></div>
        </div>

        <div class="seat-info">
            <div class="seat-label">您的座位是</div>
            <div class="seat-number" id="seatNumber">-</div>
            <div class="seat-company" id="seatCompany"></div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="showMap()">📍 查看座位图</button>
            <button class="btn-secondary" onclick="goBack()">← 重新查询</button>
        </div>
    </div>

    <!-- Seat Map Modal -->
    <div class="modal" id="mapModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>座位图</h3>
                <button class="modal-close" onclick="closeMap()">×</button>
            </div>
            <div class="modal-body">
                <img id="seatMapImg" src="" alt="座位图">
            </div>
        </div>
    </div>

    <script>
        // Read params from URL
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const seat = params.get('seat');
        const company = params.get('company');

        if (!name || !seat) {
            // Missing params, redirect back to search
            window.location.href = 'search.html';
        }

        document.getElementById('seatNumber').textContent = decodeURIComponent(seat);
        document.getElementById('seatCompany').textContent = decodeURIComponent(company);

        function showMap() {
            document.getElementById('seatMapImg').src = 'seat-map.jpg';
            document.getElementById('mapModal').classList.add('active');
        }

        function closeMap() {
            document.getElementById('mapModal').classList.remove('active');
        }

        function goBack() {
            window.location.href = 'search.html';
        }

        document.getElementById('mapModal').addEventListener('click', e => {
            if (e.target.id === 'mapModal') closeMap();
        });
    </script>
</body>
</html>
