<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>座位查询 - 中国电信云生态大会</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: url('seat-map.jpg') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px 40px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        /* Title block */
        .title-block {
            text-align: center;
            color: #fff;
            margin-bottom: 36px;
        }
        .title-block h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            line-height: 1.4;
        }
        .title-block p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 8px;
            color: #e0e0e0;
        }

        /* Floating card */
        .card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Step 1: Name Input */
        .search-box { display: flex; gap: 10px; }
        .search-box input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus { border-color: #667eea; }
        .search-box button {
            padding: 14px 22px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }
        .search-box button:active { transform: scale(0.98); }

        /* Step 2: Company Selection */
        .company-list { display: none; }
        .company-list h3 {
            text-align: center;
            color: #333;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .company-item {
            display: block;
            padding: 13px 16px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .company-item:hover {
            border-color: #667eea;
            background: #f8f6ff;
        }
        .company-item .name { font-weight: 600; color: #333; font-size: 15px; }
        .company-item .company { font-size: 12px; color: #888; margin-top: 3px; }

        /* Result */
        .result { display: none; text-align: center; }
        .result .seat-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .result .seat-label { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
        .result .seat-number { font-size: 34px; font-weight: 700; }
        .result .seat-company {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.85;
            word-break: break-all;
        }
        .result button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .result button:hover {
            background: #667eea;
            color: #fff;
        }

        /* Error */
        .error {
            text-align: center;
            color: #e74c3c;
            padding: 20px;
            display: none;
        }
        .error.show { display: block; }

        /* Back btn */
        .back-btn {
            display: inline-block;
            padding: 8px 0;
            color: #667eea;
            font-size: 13px;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .back-btn:hover { text-decoration: underline; }

        /* Seat Map Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
        }
        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { color: #333; }
        .modal-close {
            width: 30px; height: 30px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .modal-body { padding: 18px; }
        .modal-body img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* Step indicator */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }
        .step-dot.active {
            background: #667eea;
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Title -->
    <div class="title-block">
        <h1>中国电信云生态大会<br>智能云应用论坛</h1>

    </div>

    <!-- Card -->
    <div class="card">
        <!-- Step 1: Name Input -->
        <div class="search-box" id="step1">
            <input type="text" id="nameInput" placeholder="请输入您的姓名" autocomplete="off">
            <button onclick="searchByName()">查询</button>
        </div>

        <!-- Step 2: Company Selection -->
        <div class="company-list" id="step2">
            <span class="back-btn" onclick="goBack()">← 重新查询</span>
            <h3>找到多位同名嘉宾，请选择您的公司</h3>
            <div id="companyList"></div>
        </div>

        <!-- Error -->
        <div class="error" id="error">
            <p>未找到匹配的嘉宾信息</p>
            <p style="font-size:13px;margin-top:8px;color:#888;">请确认姓名输入正确</p>
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <span class="back-btn" onclick="goBack()">← 重新查询</span>
            <div class="seat-info">
                <div class="seat-label">您的座位是</div>
                <div class="seat-number" id="seatNumber">-</div>
                <div class="seat-company" id="seatCompany"></div>
            </div>
            <button onclick="showMap()">📍 查看座位图</button>
        </div>
    </div>

    <!-- Seat Map Modal -->
    <div class="modal" id="mapModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>座位图</h3>
                <button class="modal-close" onclick="closeMap()">×</button>
            </div>
            <div class="modal-body">
                <img id="seatMapImg" src="" alt="座位图">
            </div>
        </div>
    </div>

    <script>
        let seatsData = [];
        fetch('seats.json')
            .then(r => r.json())
            .then(d => seatsData = d.seats)
            .catch(e => console.error('Failed to load seats.json', e));

        const nameInput = document.getElementById('nameInput');
        nameInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') searchByName();
        });

        function searchByName() {
            const name = nameInput.value.trim();
            if (!name) return;
            const matches = seatsData.filter(s => s.name === name);
            hideAll();
            if (matches.length === 0) {
                document.getElementById('error').classList.add('show');
            } else if (matches.length === 1) {
                showResult(matches[0]);
            } else {
                showCompanySelection(matches);
            }
        }

        function showCompanySelection(matches) {
            const container = document.getElementById('companyList');
            container.innerHTML = '';
            matches.forEach(seat => {
                const div = document.createElement('div');
                div.className = 'company-item';
                div.innerHTML = `
                    <div class="name">${seat.name}</div>
                    <div class="company">${seat.company}</div>
                `;
                div.onclick = () => showResult(seat);
                container.appendChild(div);
            });
            document.getElementById('step2').style.display = 'block';
        }

        function showResult(seat) {
            const params = new URLSearchParams({
                name: seat.name,
                seat: seat.seatRaw,
                company: seat.company
            });
            window.location.href = 'result.html?' + params.toString();
        }

        function showMap() {
            document.getElementById('seatMapImg').src = 'seat-map.jpg';
            document.getElementById('mapModal').classList.add('active');
        }

        function closeMap() {
            document.getElementById('mapModal').classList.remove('active');
        }

        function goBack() {
            hideAll();
            document.getElementById('step1').style.display = 'flex';
            nameInput.value = '';
            nameInput.focus();
        }

        function hideAll() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('error').classList.remove('show');
            document.getElementById('result').style.display = 'none';
        }

        document.getElementById('mapModal').addEventListener('click', e => {
            if (e.target.id === 'mapModal') closeMap();
        });
    </script>
</body>
</html>
