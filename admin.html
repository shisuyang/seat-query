<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座位管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .form-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
        }
        
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .btn:active { transform: scale(0.98); }
        
        /* File upload */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: #667eea; background: #f8f6ff; }
        .upload-area input { display: none; }
        .upload-icon { font-size: 36px; margin-bottom: 10px; }
        .upload-text { color: #888; font-size: 14px; }
        
        /* List */
        .list-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .list-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-header h3 { font-size: 15px; color: #333; }
        .list-count { 
            background: #667eea; 
            color: #fff; 
            font-size: 12px; 
            padding: 3px 10px; 
            border-radius: 20px;
        }
        
        .list-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-info .name { font-weight: 600; color: #333; }
        .list-item-info .detail { font-size: 13px; color: #888; margin-top: 3px; }
        .list-item-seat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .message.show { opacity: 1; }
        .message.success { background: #27ae60; }
        .message.error { background: #e74c3c; }
        
        /* Search in list */
        .search-bar {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
        }
        .search-bar input:focus { border-color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗂️ 座位管理</h1>
        
        <!-- Add New Entry -->
        <div class="form-card">
            <div class="form-title">➕ 添加嘉宾</div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="inputName" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>公司</label>
                <input type="text" id="inputCompany" placeholder="请输入公司名称">
            </div>
            <div class="form-group">
                <label>座位位置</label>
                <div style="display:flex;gap:10px;">
                    <select id="inputRowType" style="flex:1;">
                        <option value="沙发">沙发</option>
                        <option value="前区">前区</option>
                        <option value="中区">中区</option>
                        <option value="后区">后区</option>
                    </select>
                    <select id="inputRow" style="flex:1;">
                        <option value="">选择排</option>
                    </select>
                    <select id="inputSeat" style="flex:1;">
                        <option value="">选择座</option>
                    </select>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="addEntry()">添加</button>
                <button class="btn btn-secondary" onclick="clearForm()">清空</button>
            </div>
        </div>
        
        <!-- Import from Excel -->
        <div class="form-card">
            <div class="form-title">📁 批量导入</div>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击选择Excel文件或拖拽到此处</div>
                <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="importExcel(event)">
            </div>
        </div>
        
        <!-- Data List -->
        <div class="list-card">
            <div class="list-header">
                <h3>嘉宾列表</h3>
                <span class="list-count" id="listCount">0</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索姓名或公司..." oninput="filterList()">
            </div>
            <div id="listContainer">
                <div class="empty">暂无数据</div>
            </div>
        </div>
        
        <!-- Export Buttons -->
        <div class="form-card" style="margin-top:20px;">
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="exportJSON()">📥 导出JSON</button>
                <button class="btn btn-secondary" onclick="exportExcel()">📥 导出Excel</button>
            </div>
        </div>
    </div>
    
    <div class="message" id="message"></div>

    <script>
        let seatsData = [];
        let filteredData = [];
        
        // Initialize row and seat selects
        function initSelects() {
            const rowSelect = document.getElementById('inputRow');
            const seatSelect = document.getElementById('inputSeat');
            
            for (let i = 1; i <= 20; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '排';
                rowSelect.appendChild(opt);
            }
            
            for (let i = 1; i <= 30; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '座';
                seatSelect.appendChild(opt);
            }
        }
        
        // Load existing data
        function loadData() {
            fetch('seats.json')
                .then(r => r.json())
                .then(d => {
                    seatsData = d.seats || [];
                    filteredData = [...seatsData];
                    renderList();
                })
                .catch(() => {
                    seatsData = [];
                    filteredData = [];
                    renderList();
                });
        }
        
        function saveData() {
            const data = {
                total: seatsData.length,
                seats: seatsData,
                nameIndex: buildNameIndex()
            };
            
            // Save to localStorage as backup
            localStorage.setItem('seats_backup', JSON.stringify(data));
            
            // Also offer download
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'seats.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function buildNameIndex() {
            const index = {};
            seatsData.forEach((seat, idx) => {
                const key = seat.name.trim();
                if (!index[key]) index[key] = [];
                index[key].push(idx);
            });
            return index;
        }
        
        function addEntry() {
            const name = document.getElementById('inputName').value.trim();
            const company = document.getElementById('inputCompany').value.trim();
            const rowType = document.getElementById('inputRowType').value;
            const row = document.getElementById('inputRow').value;
            const seat = document.getElementById('inputSeat').value;
            
            if (!name) { showMessage('请输入姓名', 'error'); return; }
            if (!company) { showMessage('请输入公司', 'error'); return; }
            if (!row || !seat) { showMessage('请选择座位', 'error'); return; }
            
            const seatRaw = rowType + row + '排' + seat + '座';
            
            const newEntry = {
                id: seatsData.length + 1,
                name: name,
                company: company,
                seatRaw: seatRaw,
                rowType: rowType,
                row: parseInt(row),
                seat: parseInt(seat)
            };
            
            seatsData.push(newEntry);
            filteredData = [...seatsData];
            renderList();
            saveData();
            clearForm();
            showMessage('添加成功！', 'success');
        }
        
        function clearForm() {
            document.getElementById('inputName').value = '';
            document.getElementById('inputCompany').value = '';
            document.getElementById('inputRow').value = '';
            document.getElementById('inputSeat').value = '';
        }
        
        function renderList() {
            document.getElementById('listCount').textContent = filteredData.length;
            const container = document.getElementById('listContainer');
            
            if (filteredData.length === 0) {
                container.innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }
            
            // Sort by seat
            filteredData.sort((a, b) => {
                if (a.rowType !== b.rowType) return a.rowType.localeCompare(b.rowType);
                if (a.row !== b.row) return a.row - b.row;
                return a.seat - b.seat;
            });
            
            container.innerHTML = filteredData.map((seat, idx) => `
                <div class="list-item">
                    <div class="list-item-info">
                        <div class="name">${escapeHtml(seat.name)}</div>
                        <div class="detail">${escapeHtml(seat.company)}</div>
                    </div>
                    <div class="list-item-seat">${seat.seatRaw}</div>
                </div>
            `).join('');
        }
        
        function filterList() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) {
                filteredData = [...seatsData];
            } else {
                filteredData = seatsData.filter(s => 
                    s.name.toLowerCase().includes(keyword) || 
                    s.company.toLowerCase().includes(keyword)
                );
            }
            renderList();
        }
        
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    // UsingSheetJS via CDN
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    
                    // Skip header, parse rows
                    const newSeats = rows.slice(1).map((row, idx) => {
                        const seatStr = row[2] || '';
                        const match = seatStr.match(/^(.+?)(\d+)排(\d+)座$/);
                        return {
                            id: seatsData.length + idx + 1,
                            name: row[0] || '',
                            company: row[1] || '',
                            seatRaw: seatStr,
                            rowType: match ? match[1] : '',
                            row: match ? parseInt(match[2]) : 0,
                            seat: match ? parseInt(match[3]) : 0
                        };
                    }).filter(s => s.name && s.seatRaw);
                    
                    seatsData = [...seatsData, ...newSeats];
                    filteredData = [...seatsData];
                    renderList();
                    saveData();
                    showMessage(`成功导入 ${newSeats.length} 条记录`, 'success');
                } catch (err) {
                    showMessage('导入失败：' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }
        
        function exportJSON() {
            saveData();
            showMessage('已导出seats.json', 'success');
        }
        
        function exportExcel() {
            const wsData = [['姓名', '公司', '排列']];
            seatsData.forEach(s => {
                wsData.push([s.name, s.company, s.seatRaw]);
            });
            
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '座位表');
            XLSX.writeFile(wb, '座位表.xlsx');
            showMessage('已导出座位表.xlsx', 'success');
        }
        
        function showMessage(text, type = '') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message show ' + type;
            setTimeout(() => msg.className = 'message', 2500);
        }
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // SheetJS CDN
        document.head.innerHTML += `<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>`;
        
        initSelects();
        loadData();
    </script>
</body>
</html>
